 let svg='<svg viewBox="0 0 320 570" role="img" aria-label="控制板 GPIO4、3、1、0 分別接到驅動板 IN1、IN2、IN3、IN4 的接線圖" xmlns="http://www.w3.org/2000/svg"><rect x="68" y="12" width="204" height="275" rx="10" fill="#242c35"/><rect x="122" y="4" width="76" height="19" rx="4" fill="#b5c0cb"/><text x="160" y="34" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">SuperMini C3</text><rect x="68" y="316" width="204" height="235" rx="10" fill="#242c35"/><text x="160" y="338" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">DRV8833</text>';

 function row(def,start){for(let i=0;i<def.left.length;i++){let y=start+i*step;for(let side of ['left','right']){let pin=def[side][i];if(!pin)continue;let cx=side==='left'?xL:xR,tx=side==='left'?102:238,anchor=side==='left'?'start':'end',map=side==='left'?(def===a?pins:targets):[],ix=map.indexOf(pin),selected=ix>=0&&(index===null||index===ix),col=selected?colors[ix]:'#e4c76a';svg+=`<circle cx="${cx}" cy="${y}" r="8" fill="${col}" stroke="${selected?'white':'#8b7850'}" stroke-width="2"/><text x="${tx}" y="${y+6}" text-anchor="${anchor}" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="${selected?'#fff4b5':'white'}">${pin}</text>`}}}
 row(a,topY);row(b,bottomY);return svg+'</svg>'
}
function renderPinGuide(step,index=null,keep=false){
 const options={battery:['lm'],power:['lm','c3','drv'],signal:['linked','c3','drv'],motors:['drv'],all:['c3','drv','lm']}[step];
 if(!keep||!options.includes(activeBoard))activeBoard=options[0];activeLine=index;
 let buttons=document.getElementById('boardChoices');buttons.replaceChildren();
 for(const key of options.length===1?[]:options){let b=document.createElement('button');b.textContent=boardDefs[key].title;b.setAttribute('aria-pressed',String(key===activeBoard));b.onclick=()=>{activeBoard=key;renderPinGuide(currentStep,activeLine,true)};buttons.append(b)}
 document.getElementById('boardSide').textContent=boardDefs[activeBoard].side;
 document.getElementById('boardMap').innerHTML=activeBoard==='linked'?drawLinkedSignal(index):drawPinBoard(activeBoard,wireHighlights(step,index)[activeBoard]);
 document.getElementById('pinHint').textContent=activeBoard==='drv'||activeBoard==='linked'?'彩色線標示這一步要接的腳位。':'彩色線標示這一步要接的腳位。';sendHeight()
}
function setDetail(key,index){detailPoints=detailSpecs[key][index];closeups.style.display='block';closeupLabels.replaceChildren();for(const [i,[name]] of detailPoints.entries()){let el=document.createElement('button');el.type='button';el.textContent=name;el.dataset.detail=i;el.addEventListener('click',()=>openDetail(i));closeupLabels.append(el)}openDetail(0);sendHeight()}
function selectWire(key,index){individual[key].forEach((g,i)=>{g.visible=i===index;g.children.forEach(n=>{if(n.isSprite||n.isLine)n.visible=labelsVisible})});document.querySelectorAll('[data-wire]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.wire)===index)));const names={battery:['電池盒紅線 → IN+','電池盒黑線 → IN−'],power:['OUT+ → C3 5V、DRV8833 VCC','OUT− → C3 G、DRV8833 GND'],signal:['GPIO4 → IN1','GPIO3 → IN2','GPIO1 → IN3','GPIO0 → IN4'],motors:['OUT1 → 左馬達','OUT2 → 左馬達','OUT3 → 右馬達','OUT4 → 右馬達']}[key];caption.textContent=names[index];renderPinGuide(key,index,true);setDetail(key,index)}
function step(key){currentStep=key;renderPinGuide(key,null);const shown={battery:['battery','lm'],power:['lm','c3','drv'],signal:['c3','drv'],motors:['drv','left','right'],all:['battery','lm','c3','drv','left','right']}[key];for(const [n,obj] of Object.entries(partNodes))obj.visible=shown.includes(n);for(const [n,obj] of Object.entries(partLabels))obj.visible=labelsVisible&&shown.includes(n);for(const [k,g] of Object.entries(paths))g.visible=key==='all'||key===k;caption.textContent=captions[key];document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.step===key)));let menu=document.getElementById('wireSelect');menu.replaceChildren();if(individual[key]){menu.style.display='flex';const names={battery:['紅線 → IN+','黑線 → IN−'],power:['OUT+ 分接','OUT− 分接'],signal:['4 → IN1','3 → IN2','1 → IN3','0 → IN4'],motors:['OUT1 左','OUT2 左','OUT3 右','OUT4 右']}[key];let all=document.createElement('button');all.textContent='全部線';all.dataset.wire='all';all.addEventListener('click',()=>{individual[key].forEach(g=>{g.visible=true;g.children.forEach(n=>{if(n.isSprite||n.isLine)n.visible=false})});menu.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===all)));caption.textContent=captions[key];renderPinGuide(key,null,true);detailPoints=[];closeups.style.display='none';document.getElementById('closeupHint').style.display='none'});menu.append(all);names.forEach((name,i)=>{const b=document.createElement('button');b.dataset.wire=i;b.textContent=name;b.addEventListener('click',()=>selectWire(key,i));menu.append(b)});all.click()}else{menu.style.display='none';closeups.style.display='none';document.getElementById('closeupHint').style.display='none';detailPoints=[];if(key==='all')for(const list of Object.values(individual))list.forEach(g=>{g.visible=true;g.children.forEach(n=>{if(n.isSprite||n.isLine)n.visible=false})})}focusStep(key)}
function setView(view){const pins=view==='pins';document.getElementById('pinGuide').hidden=!pins;document.getElementById('threePanel').hidden=pins;document.getElementById('pinViewTab').setAttribute('aria-pressed',String(pins));document.getElementById('threeViewTab').setAttribute('aria-pressed',String(!pins));if(!pins){resize();sizeModal()}sendHeight()}
document.getElementById('pinViewTab').onclick=()=>setView('pins');document.getElementById('threeViewTab').onclick=()=>setView('three');
document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>step(b.dataset.step)));document.getElementById('reset').onclick=()=>focusStep(currentStep);document.getElementById('mainZoomIn').onclick=()=>{camera.zoom=Math.min(40,camera.zoom*1.5);camera.updateProjectionMatrix()};document.getElementById('mainZoomOut').onclick=()=>{camera.zoom=Math.max(.7,camera.zoom/1.5);camera.updateProjectionMatrix()};
document.getElementById('toggleTags').addEventListener('click',e=>{labelsVisible=!labelsVisible;e.currentTarget.textContent=labelsVisible?'隱藏標籤':'顯示標籤';e.currentTarget.setAttribute('aria-pressed',String(labelsVisible));const shown={battery:['battery','lm'],power:['lm','c3','drv'],signal:['c3','drv'],motors:['drv','left','right'],all:['battery','lm','c3','drv','left','right']}[currentStep];for(const [n,obj] of Object.entries(partLabels))obj.visible=labelsVisible&&shown.includes(n);for(const [k,list] of Object.entries(individual))for(const g of list)if(g.visible)g.children.forEach(n=>{if(n.isSprite||n.isLine)n.visible=labelsVisible&&currentStep!=='all'&&document.querySelector('[data-wire][aria-pressed="true"]')?.dataset.wire!=='all'})});
function initModal(){if(modalRenderer)return;modalRenderer=new THREE.WebGLRenderer({antialias:true,alpha:false});modalRenderer.setPixelRatio(Math.min(devicePixelRatio,2));modalRenderer.setClearColor(0xe8eff8);modalRenderer.outputColorSpace=THREE.SRGBColorSpace;detailView.append(modalRenderer.domElement);modalCamera=new THREE.OrthographicCamera(-10,10,10,-10,.1,500);modalControls=new OrbitControls(modalCamera,modalRenderer.domElement);modalControls.enableDamping=true;modalControls.enablePan=true;modalControls.screenSpacePanning=true;modalControls.minZoom=.5;modalControls.maxZoom=20}
function sizeModal(){if(!modalRenderer||closeups.style.display==='none')return;let w=detailView.clientWidth,h=detailView.clientHeight,aspect=w/h;if(!w||!h)return;modalCamera.left=-9*aspect;modalCamera.right=9*aspect;modalCamera.top=9;modalCamera.bottom=-9;modalCamera.updateProjectionMatrix();modalRenderer.setSize(w,h,false)}
function resetModal(){if(!modalControls||!modalTarget)return;modalControls.target.copy(modalTarget);modalCamera.position.copy(modalTarget).add(new THREE.Vector3(-15,48,18));modalCamera.zoom=1;modalCamera.updateProjectionMatrix();modalControls.update()}
function openDetail(i){if(!detailPoints[i])return;initModal();modalTarget=new THREE.Vector3(...detailPoints[i][1]);closeupLabels.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.detail)===i)));sizeModal();resetModal()}
document.getElementById('detailReset').onclick=resetModal;document.getElementById('zoomIn').onclick=()=>{if(!modalCamera)return;modalCamera.zoom=Math.min(20,modalCamera.zoom*1.45);modalCamera.updateProjectionMatrix()};document.getElementById('zoomOut').onclick=()=>{if(!modalCamera)return;modalCamera.zoom=Math.max(.5,modalCamera.zoom/1.45);modalCamera.updateProjectionMatrix()};new ResizeObserver(sizeModal).observe(detailView);
function renderWithoutLabels(renderer,targetCamera){const hidden=[];scene.traverse(n=>{if((n.isSprite||n.isLine)&&n.visible){hidden.push(n);n.visible=false}});renderer.render(scene,targetCamera);hidden.forEach(n=>n.visible=true)}

function resize(){let w=holder.clientWidth,h=holder.clientHeight,aspect=w/h;let halfWidth=Math.max(235,185*aspect);camera.left=-halfWidth;camera.right=halfWidth;camera.top=halfWidth/aspect;camera.bottom=-halfWidth/aspect;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}new ResizeObserver(resize).observe(holder);resize();
Promise.all([part('battery.glb',-160,0),part('lm.glb',-55,0),part('c3.glb',50,-60,true),part('drv.glb',50,40,true),part('motor.glb',160,25),part('motor.glb',160,75)]).then(parts=>{['battery','lm','c3','drv','left','right'].forEach((name,i)=>partNodes[name]=parts[i]);step('battery')}).catch(e=>{console.error(e);document.getElementById('error').textContent='模型載入失敗，請檢查網路後重新整理。'});
function sendHeight(){requestAnimationFrame(()=>{if(window.parent!==window)window.parent.postMessage({type:'rover-wiring-height',height:Math.ceil(document.body.getBoundingClientRect().height)},location.origin)})}new ResizeObserver(sendHeight).observe(document.body);
function animate(){requestAnimationFrame(animate);controls.update();for(const sprite of Object.values(partLabels))if(sprite.userData.nameLabel){let n=Math.max(1,camera.zoom);sprite.scale.set(68/n,13/n,1)}renderer.render(scene,camera);if(modalRenderer&&closeups.style.display!=='none'){modalControls.update();renderWithoutLabels(modalRenderer,modalCamera)}}animate();
